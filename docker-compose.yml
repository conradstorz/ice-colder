name: ice-colder

# The four Python services share one image. CI publishes
# ghcr.io/conradstorz/ice-colder:latest on every push to main and Watchtower
# (label-gated, daily 04:00 on the sim host) swaps the containers in. For an
# immediate update: docker compose pull; docker compose up -d.
# `build: .` stays so `docker compose up --build` still works for local dev.
#
# Requires a `.env` file: cp .env.example .env, then set MQTT_PASSWORD (and
# the other values) before bringing the stack up.

services:
  vmc:
    image: ghcr.io/conradstorz/ice-colder:latest
    build: .
    labels:
      - com.centurylinklabs.watchtower.enable=true
      - traefik.enable=true
      - traefik.http.routers.ice.rule=Host(`ice.hpz440.ohr3023.org`)
      - traefik.http.routers.ice.entrypoints=websecure
      - traefik.http.routers.ice.tls=true
      - traefik.http.services.ice.loadbalancer.server.port=26123
      - harbor.description=Ice Colder VMC
    container_name: ice-colder-vmc
    volumes:
      - ./LOGS:/app/LOGS
      - ./data:/app/data
    environment:
      - MQTT_BROKER_HOST=mosquitto
      - MQTT_USERNAME=${MQTT_USERNAME}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - ICE_COLDER_CONFIG=/app/data/config.json
      - ICE_COLDER_TRUSTED_PROXIES=${ICE_COLDER_TRUSTED_PROXIES:-}
    networks:
      - broker
      - harbor
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped

  sim-ice-maker:
    image: ghcr.io/conradstorz/ice-colder:latest
    build: .
    labels:
      - com.centurylinklabs.watchtower.enable=true
      - harbor.kind=internal
    container_name: ice-colder-sim-ice-maker
    command: ["uv", "run", "python", "-m", "simulators.ice_maker", "--broker", "mosquitto"]
    volumes:
      - ./data:/app/data:ro
    environment:
      - ICE_COLDER_CONFIG=/app/data/config.json
      - MQTT_USERNAME=${MQTT_USERNAME}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
    networks:
      - broker
    depends_on:
      mosquitto:
        condition: service_healthy
      vmc:
        condition: service_started
    restart: unless-stopped

  sim-mdb:
    image: ghcr.io/conradstorz/ice-colder:latest
    build: .
    labels:
      - com.centurylinklabs.watchtower.enable=true
      - harbor.kind=internal
    container_name: ice-colder-sim-mdb
    command: ["uv", "run", "python", "-m", "simulators.mdb_gateway", "--broker", "mosquitto"]
    volumes:
      - ./data:/app/data:ro
    environment:
      - ICE_COLDER_CONFIG=/app/data/config.json
      - MQTT_USERNAME=${MQTT_USERNAME}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
    networks:
      - broker
    depends_on:
      mosquitto:
        condition: service_healthy
      vmc:
        condition: service_started
    restart: unless-stopped

  sim-vending:
    image: ghcr.io/conradstorz/ice-colder:latest
    build: .
    labels:
      - com.centurylinklabs.watchtower.enable=true
      - harbor.kind=internal
    container_name: ice-colder-sim-vending
    command: ["uv", "run", "python", "-m", "simulators.vending_machine", "--broker", "mosquitto"]
    volumes:
      - ./data:/app/data:ro
    environment:
      - ICE_COLDER_CONFIG=/app/data/config.json
      - MQTT_USERNAME=${MQTT_USERNAME}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
    networks:
      - broker
    depends_on:
      mosquitto:
        condition: service_healthy
      vmc:
        condition: service_started
    restart: unless-stopped

  mosquitto-init:
    # One-shot: writes the broker password file from .env before mosquitto starts.
    image: eclipse-mosquitto:2
    container_name: ice-colder-mqtt-init
    # Explicit: must be able to write the bind-mounted config dir and chown.
    user: root
    environment:
      - MQTT_USERNAME=${MQTT_USERNAME:?set MQTT_USERNAME in .env}
      - MQTT_PASSWORD=${MQTT_PASSWORD:?set MQTT_PASSWORD in .env}
    volumes:
      - ./docker/mosquitto/config:/mosquitto/config
    entrypoint: ["sh", "-c"]
    command:
      - mosquitto_passwd -c -b /mosquitto/config/passwd "$$MQTT_USERNAME" "$$MQTT_PASSWORD" && chmod 600 /mosquitto/config/passwd && chown mosquitto:mosquitto /mosquitto/config/passwd
    restart: "no"

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: ice-colder-mqtt
    labels:
      - harbor.kind=tcp
      - harbor.port=1883
      - harbor.description=MQTT broker
    ports:
      - "${MQTT_BIND_ADDR:?set MQTT_BIND_ADDR in .env to the LAN interface address}:1883:1883"
    # Mount the whole config dir (not the individual files): `passwd` is
    # gitignored and written by mosquitto-init at startup, so a single-file
    # bind mount would let Docker create it as a directory on a fresh
    # checkout. No :ro here either — the image entrypoint chowns under
    # /mosquitto/config on start.
    command: ["/usr/sbin/mosquitto", "-c", "/mosquitto/config/mosquitto-prod.conf"]
    volumes:
      - ./docker/mosquitto/config:/mosquitto/config
      - ./docker/mosquitto/data:/mosquitto/data
      - ./docker/mosquitto/log:/mosquitto/log
    environment:
      - MQTT_USERNAME=${MQTT_USERNAME}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
    restart: unless-stopped
    networks:
      - broker
    depends_on:
      mosquitto-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -u \"$$MQTT_USERNAME\" -P \"$$MQTT_PASSWORD\" -t '$$SYS/broker/uptime' -C 1 -W 3"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  broker:
    driver: bridge
  harbor:
    external: true
