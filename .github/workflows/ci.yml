name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One run per ref at a time; a newer push cancels the older one so the mutable
# `latest` tag can never be moved backward by a slower, superseded main run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run lint-imports
      - run: uv run python scripts/check_package_isolation.py

  test:
    runs-on: ubuntu-latest
    steps:
      # Full history (all branches/tags), not the default shallow single-branch
      # checkout -- TestScreenTemplatesUnchanged::test_matches_origin_main
      # diffs against origin/main and otherwise skips in CI with "bad revision
      # 'origin/main'" because that ref is never fetched, silently disabling
      # the /screen byte-identical guard. The extended guard step below fails
      # the build if that happens again.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      # Pinned, explicit Chrome build for the four opt-in browser tests below —
      # deliberately not whatever ubuntu-latest happens to ship, which changes
      # without notice. Chrome for Testing has archived per-major downloads
      # since ~113; 130 is a stable, comfortably-available pin.
      - name: Set up Chrome (for the opt-in browser tests)
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: 130
      # Node 24 is current Active LTS (22 is Maintenance LTS). The checker
      # scripts under tests/browser/*.mjs need Node's built-in global fetch
      # and WebSocket client (WebSocket ships unflagged from 22.4/24 on),
      # so pin an LTS line that's comfortably past that floor.
      - name: Set up Node (for the opt-in browser tests)
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      # Anonymous mosquitto on localhost:1883 for tests/integration/test_integration_e2e.py
      # (sale, refund, jam lockout, overpay over real MQTT). GitHub `services:`
      # cannot override the container command, and mosquitto 2.x refuses
      # anonymous connections without a config, so run it as a step with an
      # inline config. The image is pinned; the wait loop is bounded.
      - name: Start MQTT broker (for the e2e tests)
        run: |
          printf '%s\n' 'listener 1883' 'allow_anonymous true' > "$RUNNER_TEMP/mosquitto.conf"
          docker run -d --name mosquitto -p 1883:1883 -v "$RUNNER_TEMP/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro" eclipse-mosquitto:2.0.20
          for i in $(seq 1 30); do
            nc -z localhost 1883 && exit 0
            sleep 1
          done
          docker logs mosquitto
          echo "::error::mosquitto did not become ready on localhost:1883"
          exit 1
      # Everything runs, including the e2e tests (broker above) and the 4
      # opt-in browser tests (enabled below) — the guard step immediately
      # after this one fails CI if any of them skip instead of running (the
      # broker skip is forbidden in CI via ICE_COLDER_REQUIRE_BROKER), so a
      # broken broker or Chrome/Node discovery can't hide behind a green suite.
      - name: Run tests (including the opt-in browser tests)
        env:
          ICE_COLDER_BROWSER_TESTS: "1"
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          set -o pipefail
          uv run pytest -q -rs
      - name: Guard against unrecognised skips via the skip policy
        env:
          ICE_COLDER_REQUIRE_BROKER: "1"
        run: |
          uv run python tests/run_skip_guard.py skip-report.json

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker network create harbor
      - run: docker compose --env-file .env.example -f docker-compose.yml config -q
      - run: docker compose --env-file .env.example -f docker/docker-compose.prod.yml config -q

  image:
    # PRs: prove the image builds. main: publish it for Watchtower on the sim host.
    needs: [lint, test, compose-config]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
      - id: stamp
        run: echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      # Smoke test: build the amd64 image into the local daemon and prove the
      # package split holds inside it. Bare `python` must be the project venv's
      # (otherwise the import checks below prove nothing), the shared packages
      # must import, and ice_cloud must NOT be installed in the edge image.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ice-colder:smoke
      - name: Smoke-test the image
        run: |
          docker run --rm ice-colder:smoke python -c "import sys; assert sys.prefix.startswith('/app/.venv'), sys.prefix"
          docker run --rm ice-colder:smoke python -c "import ice_contracts, ice_common"
          docker run --rm ice-colder:smoke uv run python -c "import ice_edge.app.machine, ice_edge.web.server, ice_sims.vending_machine"
          if docker run --rm ice-colder:smoke python -c "import ice_cloud" 2> cloud.err; then
            echo "::error::ice_cloud must not be importable in the edge image"
            exit 1
          fi
          cat cloud.err
          grep -q "ModuleNotFoundError: No module named 'ice_cloud'" cloud.err
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILD_TIME=${{ steps.stamp.outputs.time }}
