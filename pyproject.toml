[project]
name = "ice-colder"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiomqtt>=2.3.0",
    "fastapi[standard]>=0.115.11",
    "loguru>=0.7.3",
    "phonenumbers>=9.0.5",
    "pillow>=11.1.0",
    "pydantic>=2.10.6",
    "pydantic-extra-types>=2.10.4",
    "pydantic-settings>=2.9.1",
    "qrcode>=8.1",
    "transitions>=0.9.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
# Tooling only. The production image installs with --no-dev, so nothing here
# may be imported by the application.
dev = [
    "pytest-asyncio>=1.3.0",
    "ruff>=0.11.2",
]
