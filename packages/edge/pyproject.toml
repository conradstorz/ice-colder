[project]
name = "ice-edge"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.11",
    "httpx>=0.28.1",
    "ice-common",
    "ice-ui",
    "loguru>=0.7.3",
    "pillow>=11.1.0",
    "qrcode>=8.1",
]

[tool.uv.sources]
ice-common = { workspace = true }
ice-ui = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ice_edge"]
