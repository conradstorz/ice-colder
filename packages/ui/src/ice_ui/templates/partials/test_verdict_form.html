{# Shared Pass/Fail verdict form for a test run. Included by
   test_result_card.html and test_sale_result.html; the caller sets
   `verdict_run_id` with {% with %}. #}
<p class="text-sm text-gray-700">Watch the machine.</p>
<div id="verdict-{{ verdict_run_id }}">
  <form hx-post="/tests/runs/{{ verdict_run_id }}/verdict" hx-target="#verdict-{{ verdict_run_id }}"
        hx-swap="outerHTML" class="space-y-2">
    <label for="note-{{ verdict_run_id }}" class="sr-only">Note (optional)</label>
    <input type="text" id="note-{{ verdict_run_id }}" name="note" placeholder="Optional note"
           class="touch-target w-full px-3 border border-gray-200 rounded-lg text-sm text-gray-900">
    <div class="flex gap-6">
      <button type="submit" name="verdict" value="pass"
              class="touch-target px-4 rounded-md bg-green-600 text-white text-sm font-medium hover:bg-green-700">
        Pass
      </button>
      <button type="submit" name="verdict" value="fail"
              class="touch-target px-4 rounded-md bg-red-600 text-white text-sm font-medium hover:bg-red-700">
        Fail
      </button>
    </div>
  </form>
</div>
