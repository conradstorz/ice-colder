{% extends "base.html" %}
{% block title %}{{ error_title }} · Vending Machine{% endblock %}
{% block body %}
<div class="max-w-sm mx-auto py-12 text-center space-y-4">
  <h1 class="text-2xl font-semibold text-gray-900">{{ error_title }}</h1>
  <p class="text-base text-gray-600">{{ error_message }}</p>
  {% if error_detail %}
  <p class="text-sm text-gray-400">{{ error_detail }}</p>
  {% endif %}
  <a href="/"
     class="touch-target inline-flex justify-center px-4 rounded-md bg-slate-800 text-white text-sm font-medium hover:bg-slate-700">Back</a>
</div>
{% endblock %}
