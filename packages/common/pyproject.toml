[project]
name = "ice-common"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiomqtt>=2.3.0",
    "ice-contracts",
    "loguru>=0.7.3",
    "phonenumbers>=9.0.5",
    "pydantic[email]>=2.10.6",
    "pydantic-settings>=2.9.1",
]

[tool.uv.sources]
ice-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ice_common"]
