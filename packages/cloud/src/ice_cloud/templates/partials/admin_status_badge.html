{% set status_value = badge_status if badge_status is defined else m.status.value %}{% if status_value == "online" %}<span class="text-xs px-1.5 py-0.5 rounded bg-green-50 text-green-700">Online</span>
{% elif status_value == "silent" %}<span class="text-xs px-1.5 py-0.5 rounded bg-red-50 text-red-600">{{ silent_label|default("Silent") }}</span>
{% else %}<span class="text-xs px-1.5 py-0.5 rounded bg-gray-100 text-gray-600">Never reported</span>{% endif %}
