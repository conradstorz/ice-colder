{% if m.status.value == "online" %}<span class="text-xs px-1.5 py-0.5 rounded bg-green-50 text-green-700">Online</span>
{% elif m.status.value == "silent" %}<span class="text-xs px-1.5 py-0.5 rounded bg-red-50 text-red-600">Silent</span>
{% else %}<span class="text-xs px-1.5 py-0.5 rounded bg-gray-100 text-gray-600">Never reported</span>{% endif %}
