[project]
name = "ice-sims"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "ice-common",
    "loguru>=0.7.3",
]

[tool.uv.sources]
ice-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ice_sims"]
