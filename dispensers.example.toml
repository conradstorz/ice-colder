# dispensers.example.toml
#
# A worked example of dispensers.toml, the hand-edited file that gives
# each physical dispense slot (one [slot.N] table) its own mechanical
# parameters: how it agitates, fills, and releases (bagged ice) or
# fills (water), plus any accessories -- fans, lights, blowers -- that
# run alongside those steps.
#
# dispensers.toml lives at the repo root (or wherever
# ICE_COLDER_DISPENSERS points), next to config.json. Each [slot.N]
# table's product_sku must name a product in the catalog (config.json's
# physical.products), and N must equal that product's own "slot" number.
#
# Validate any dispensers.toml with:
#     uv run python -m services.dispensers --check
#
# This file is GENERATED by scripts/gen_dispensers_example.py from the
# models in services/dispenser_schema.py -- every comment below is
# rendered from that schema's own Field descriptions, units, and
# ranges. Do not hand-edit this example; edit the schema instead, then
# regenerate:
#     uv run python scripts/gen_dispensers_example.py

# Version of this file's own schema (distinct from the product catalog's). Must be 1 -- validate_document refuses any other value.
schema_version = 1

# ----------------------------------------------------------------------
# Slot 0 -- bagged ice (SAMPLE-ICE)
# ----------------------------------------------------------------------
[slot.0]
# This slot dispenses pre-bagged ice. One of: bagged_ice.
mechanism = "bagged_ice"
# The product SKU this slot dispenses.
product_sku = "SAMPLE-ICE"

# How this slot breaks up clumped ice before filling.
[slot.0.agitate]
# Motor current above which the board should treat the motor as stalled and stop driving it, or "unmonitored" if this board has no current sensor.
stall_current_amps = "unmonitored"
# The telemetry channel that reports this motor's current draw, or "unmonitored" if this board has no current sensor.
current_channel = "unmonitored"
# The channel that drives the agitator motor.
motor_channel = "agitator_motor"
# How long the agitator motor runs for this step. Unit: s. Range: 0.5–60.
run_seconds = 8

# How this slot feeds ice toward the release gate.
[slot.0.fill]
# Motor current above which the board should treat the motor as stalled and stop driving it, or "unmonitored" if this board has no current sensor.
stall_current_amps = "unmonitored"
# The telemetry channel that reports this motor's current draw, or "unmonitored" if this board has no current sensor.
current_channel = "unmonitored"
# This fill step is proven complete by a sensor. One of: bag_full_sensor.
proof = "bag_full_sensor"
# The channel that drives the auger/fill motor.
motor_channel = "auger_motor"
# The channel that reports the bag as full.
sensor_channel = "bag_full_sensor"
# The longest the fill motor is allowed to run before the VMC gives up on this step even if the bag-full sensor never fires. Unit: s. Range: 1–120.
max_run_seconds = 45

# If proof = "timed" instead, the fields are:
# Motor current above which the board should treat the motor as stalled and stop driving it, or "unmonitored" if this board has no current sensor.
# stall_current_amps = "unmonitored"
# The telemetry channel that reports this motor's current draw, or "unmonitored" if this board has no current sensor.
# current_channel = "unmonitored"
# This fill step is proven complete by elapsed time. One of: timed.
# proof = "timed"
# The channel that drives the auger/fill motor.
# motor_channel = "auger_motor"
# How long the fill motor runs for this step. Unit: s. Range: 1–120.
# max_run_seconds = 45

# How this slot opens and closes its release gate.
[slot.0.release]
# This release step is proven open/closed by a sensor. One of: door_sensor.
proof = "door_sensor"
# The channel that drives the release-gate solenoid.
solenoid_channel = "bag_drop_solenoid"
# The channel that reports the release gate's state.
sensor_channel = "door_sensor"
# How long the solenoid is pulsed to open the gate. Unit: s. Range: 0.1–10.
pulse_seconds = 1
# The longest the VMC waits for the door sensor to report open before treating the release as failed. Unit: s. Range: 0.5–30.
open_timeout_seconds = 5
# The longest the VMC waits for the door sensor to report closed again before treating the release as failed. Unit: s. Range: 0.5–60.
close_timeout_seconds = 5

# If proof = "timed" instead, the fields are:
# This release step is proven open/closed by elapsed time. One of: timed.
# proof = "timed"
# The channel that drives the release-gate solenoid.
# solenoid_channel = "bag_drop_solenoid"
# How long the solenoid is pulsed to open the gate. Unit: s. Range: 0.1–10.
# pulse_seconds = 1

# Devices that run alongside this slot's steps, by name.
[slot.0.accessories.bag_fan]
# The channel that drives this accessory.
channel = "bag_fan"
# Which steps this accessory runs during, by name, or ["all"] to run for the whole slot cycle.
on_during = ["agitate", "fill"]
# How long before its step(s) start this accessory turns on. Unit: s. Range: 0–30.
lead_seconds = 0
# How long after its step(s) end this accessory stays on. Unit: s. Range: 0–30.
lag_seconds = 2

[slot.0.accessories.vending_now_light]
# The channel that drives this accessory.
channel = "vending_now_light"
# Which steps this accessory runs during, by name, or ["all"] to run for the whole slot cycle.
on_during = ["all"]
# How long before its step(s) start this accessory turns on. Unit: s. Range: 0–30.
lead_seconds = 0
# How long after its step(s) end this accessory stays on. Unit: s. Range: 0–30.
lag_seconds = 0

# ----------------------------------------------------------------------
# Slot 1 -- water, fill proven by a flow meter (SAMPLE-WATER-SM)
# ----------------------------------------------------------------------
[slot.1]
# This slot dispenses water. One of: water_fill.
mechanism = "water_fill"
# The product SKU this slot dispenses.
product_sku = "SAMPLE-WATER-SM"

# How this slot fills the cup/bottle.
[slot.1.fill]
# This fill step is proven complete by a flow meter. One of: flow_volume.
proof = "flow_volume"
# The channel that drives the fill valve.
valve_channel = "water_valve_solenoid"
# The channel that reports flow-meter pulses.
flow_sensor_channel = "water_flow_sensor"
# The volume this slot dispenses on a successful fill. Unit: ml. Range: 50–50000.
target_volume_ml = 3785
# The flow meter's calibration constant. Unit: pulses/L. Range: greater than 0.
pulses_per_liter = 450
# The slowest flow rate still considered "flowing"; below this, the no-flow grace timer starts. Unit: ml/s. Range: greater than 0.
min_flow_ml_per_second = 10
# How long flow may stay below the minimum rate (a clogged valve, an empty supply) before the VMC treats the fill as failed. Unit: s. Range: 0.5–30.
no_flow_grace_seconds = 5
# How far past the target volume the VMC tolerates (a sticking valve closing late) before treating the fill as a fault rather than a successful dispense. Unit: %. Range: 0–50.
over_dispense_percent = 5
# The longest the fill valve is allowed to stay open before the VMC gives up on this step even if the target volume was never reached. Unit: s. Range: 1–600.
max_fill_seconds = 90

# If proof = "timed" instead, the fields are:
# This fill step is proven complete by elapsed time. One of: timed.
# proof = "timed"
# The channel that drives the fill valve.
# valve_channel = "water_valve_solenoid"
# How long the fill valve stays open for this step. Unit: s. Range: 1–600.
# max_fill_seconds = 90

# Devices that run alongside this slot's steps, by name.
# accessories: none for this slot.

