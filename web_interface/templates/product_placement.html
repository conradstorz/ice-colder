{% extends "base.html" %}
{% block title %}Placement · {{ product.name or product.sku }} · Vending Machine{% endblock %}
{% block body %}
<form hx-post="/products/{{ product.sku }}/placement" class="max-w-md space-y-4">
  <h1 class="text-hero font-semibold text-gray-900">Placement</h1>

  {% if error %}
  <p class="text-sm text-red-600">{{ error }}</p>
  {% endif %}

  <div>
    <label for="sku" class="block text-xs font-medium text-gray-500 uppercase tracking-wide mb-1">SKU</label>
    <input type="text" id="sku" value="{{ product.sku }}" disabled
           class="touch-target w-full px-3 bg-gray-100 border border-gray-200 rounded-lg text-sm text-gray-500 font-mono">
  </div>

  <div>
    <label for="slot" class="block text-xs font-medium text-gray-500 uppercase tracking-wide mb-1">Dispenser Slot</label>
    <input type="number" id="slot" name="slot" value="{{ product.slot }}" min="0" step="1" inputmode="numeric" required
           class="touch-target w-full px-3 border border-gray-200 rounded-lg text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500">
  </div>

  <div>
    <label for="inventory_count" class="block text-xs font-medium text-gray-500 uppercase tracking-wide mb-1">Inventory Count</label>
    <input type="number" id="inventory_count" name="inventory_count" value="{{ inventory_count }}" min="0" step="1" inputmode="numeric" required
           class="touch-target w-full px-3 border border-gray-200 rounded-lg text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500">
  </div>

  <div class="touch-target">
    <input type="checkbox" id="track_inventory" name="track_inventory" {{ "checked" if tracked }}
           class="h-5 w-5 rounded border-gray-300 text-blue-600 focus:ring-blue-500">
    <label for="track_inventory" class="text-sm text-gray-700">Track inventory</label>
  </div>

  <div class="flex gap-touch pt-2">
    <button type="submit"
            class="touch-target px-4 rounded-md bg-slate-800 text-white text-sm font-medium hover:bg-slate-700">Save</button>
    <a href="/products/{{ product.sku }}"
       class="touch-target px-4 rounded-md border border-gray-300 text-sm font-medium text-gray-700 hover:bg-gray-50">Cancel</a>
  </div>
</form>
{% endblock %}
