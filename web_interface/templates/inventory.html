{% extends "base.html" %}
{% block title %}Inventory · Vending Machine{% endblock %}
{% block body %}
<div class="space-y-4">
  <h1 class="text-hero font-semibold text-gray-900">Inventory</h1>

  {% if rows %}
  <div class="space-y-2">
    {% for row in rows %}
    {% include "partials/inventory_row.html" with context %}
    {% endfor %}
  </div>
  {% else %}
  <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-5 text-center text-sm text-gray-400">
    No products configured.
  </div>
  {% endif %}
</div>
{% endblock %}
