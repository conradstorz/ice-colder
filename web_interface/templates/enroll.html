<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirm this device — Vending Machine</title>
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-gray-900 font-sans min-h-screen flex items-center justify-center">
  <main class="w-full max-w-sm p-6 space-y-6">
    <h1 class="text-xl font-semibold text-center">Confirm this device</h1>
    <!-- Placeholder for Task 10: enter the code sent to this user to trust
         this browser. This file is intentionally minimal; Task 10 replaces
         it with the full enrollment flow (spec §2.3). -->
    <p class="text-sm text-gray-700">
      Enter the code we sent {{ user.name if user else "you" }} to confirm this device.
    </p>
    {% if error %}
      <p class="text-red-600 text-sm" role="alert">{{ error }}</p>
    {% endif %}
  </main>
</body>
</html>
