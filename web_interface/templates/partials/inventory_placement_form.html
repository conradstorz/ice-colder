{# web_interface/templates/partials/inventory_placement_form.html #}
<form
  hx-post="/inventory/update/{{ product.sku }}/placement"
  hx-target="#content-body"
  hx-swap="innerHTML"
  class="space-y-4 max-w-md">

  <h2 class="text-base font-semibold text-gray-900">Edit Placement</h2>

  <div>
    <label for="sku" class="block text-xs font-medium text-gray-500 uppercase tracking-wide mb-1">SKU</label>
    <input type="text" id="sku" value="{{ product.sku }}" disabled
           class="w-full px-3 py-2 bg-gray-100 border border-gray-200 rounded-lg text-sm text-gray-500 font-mono">
  </div>

  <div>
    <label for="slot" class="block text-xs font-medium text-gray-500 uppercase tracking-wide mb-1">Dispenser Slot</label>
    <input type="number" id="slot" name="slot" value="{{ product.slot }}" min="0" step="1" required
           class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500">
  </div>

  <div>
    <label for="inventory_count" class="block text-xs font-medium text-gray-500 uppercase tracking-wide mb-1">Inventory Count</label>
    <input type="number" id="inventory_count" name="inventory_count" value="{{ inventory_count }}"
           class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500">
  </div>

  <div class="flex items-center gap-2">
    <input type="checkbox" id="track_inventory" name="track_inventory" {{ "checked" if tracked }}
           class="h-4 w-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500">
    <label for="track_inventory" class="text-sm text-gray-700">Track inventory</label>
  </div>

  <div class="flex gap-3 pt-2">
    <button type="submit"
            class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors">
      Save Changes
    </button>
    <button type="button"
            hx-get="/inventory"
            hx-target="#content-body"
            hx-swap="innerHTML"
            class="border border-gray-200 hover:bg-gray-50 text-gray-600 px-4 py-2 rounded-lg text-sm font-medium transition-colors">
      Cancel
    </button>
  </div>
</form>
