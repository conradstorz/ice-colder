{# web_interface/templates/partials/inventory_add_form.html #}
<form
  hx-post="/inventory/add"
  hx-target="#content-body"
  hx-swap="innerHTML"
  class="space-y-4 max-w-md">

  <h2 class="text-base font-semibold text-gray-900">{{ "Copy Product" if mode == "copy" else "Add Product" }}</h2>

  <div>
    <label for="sku" class="block text-xs font-medium text-gray-500 uppercase tracking-wide mb-1">SKU</label>
    <input type="text" id="sku" name="sku" value="{{ product.sku }}"
           class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm text-gray-900 font-mono focus:outline-none focus:ring-2 focus:ring-blue-500">
  </div>

  <div>
    <label for="name" class="block text-xs font-medium text-gray-500 uppercase tracking-wide mb-1">Name</label>
    <input type="text" id="name" name="name" value="{{ product.name }}"
           class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500">
  </div>

  <div>
    <label for="price" class="block text-xs font-medium text-gray-500 uppercase tracking-wide mb-1">Price (USD)</label>
    <input type="number" id="price" name="price" value="{{ product.price }}" step="0.01"
           class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500">
  </div>

  <div>
    <label for="inventory_count" class="block text-xs font-medium text-gray-500 uppercase tracking-wide mb-1">Inventory Count</label>
    <input type="number" id="inventory_count" name="inventory_count" value="{{ product.inventory_count }}"
           class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500">
  </div>

  <div>
    <label for="slot" class="block text-xs font-medium text-gray-500 uppercase tracking-wide mb-1">Dispenser Slot</label>
    <input type="number" id="slot" name="slot" min="0" step="1" placeholder="Auto-assign"
           class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500">
  </div>

  <div>
    <label for="kind" class="block text-xs font-medium text-gray-500 uppercase tracking-wide mb-1">Kind</label>
    <select id="kind" name="kind"
            class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500">
      <option value="ice" {{ "selected" if product.kind == "ice" }}>Ice</option>
      <option value="water" {{ "selected" if product.kind == "water" }}>Water</option>
      <option value="other" {{ "selected" if product.kind == "other" }}>Other</option>
    </select>
  </div>

  <div class="flex gap-3 pt-2">
    <button type="submit"
            class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors">
      {{ "Copy Product" if mode == "copy" else "Add Product" }}
    </button>
    <button type="button"
            hx-get="/inventory"
            hx-target="#content-body"
            hx-swap="innerHTML"
            class="border border-gray-200 hover:bg-gray-50 text-gray-600 px-4 py-2 rounded-lg text-sm font-medium transition-colors">
      Cancel
    </button>
  </div>
</form>
