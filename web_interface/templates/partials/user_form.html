{# web_interface/templates/partials/user_form.html #}
<form
  hx-post="/users/new"
  hx-target="#content-body"
  hx-swap="innerHTML"
  class="space-y-4 max-w-md">

  <h2 class="text-base font-semibold text-gray-900">Add User</h2>

  <div>
    <label for="name" class="block text-xs font-medium text-gray-500 uppercase tracking-wide mb-1">Name</label>
    <input type="text" id="name" name="name" value="{{ form.name }}" required
           class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500">
  </div>

  <div>
    <label for="email" class="block text-xs font-medium text-gray-500 uppercase tracking-wide mb-1">Email (optional)</label>
    <input type="email" id="email" name="email" value="{{ form.email }}"
           class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500">
  </div>

  <div>
    <label for="role" class="block text-xs font-medium text-gray-500 uppercase tracking-wide mb-1">Role</label>
    <select id="role" name="role"
            class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500">
      {% for r in roles %}
      <option value="{{ r.value }}" {{ "selected" if form.role == r.value }}>{{ r.value.capitalize() }}</option>
      {% endfor %}
    </select>
  </div>

  <div>
    <label for="pin" class="block text-xs font-medium text-gray-500 uppercase tracking-wide mb-1">Initial PIN (4–8 digits)</label>
    <input type="text" id="pin" name="pin" inputmode="numeric" pattern="[0-9]*"
           autocomplete="off" required
           class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500">
  </div>

  {% if error %}<p class="text-red-600 text-sm" role="alert">{{ error }}</p>{% endif %}

  <div class="flex gap-3 pt-2">
    <button type="submit"
            class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors">
      Add User
    </button>
    <button type="button"
            hx-get="/users"
            hx-target="#content-body"
            hx-swap="innerHTML"
            class="border border-gray-200 hover:bg-gray-50 text-gray-600 px-4 py-2 rounded-lg text-sm font-medium transition-colors">
      Cancel
    </button>
  </div>
</form>
