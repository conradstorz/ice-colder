name: ice_cloud

# Cloud fleet portal (identity and tenancy spec 2026-10-19, section 8).
# From the repository root, with ICE_CLOUD_* set in .env (see .env.example):
#   docker compose -f docker/docker-compose.cloud.yml up --build
# On a server, pull the image CI publishes on main instead of building:
#   docker compose -f docker/docker-compose.cloud.yml pull && ... up -d
# The container binds 0.0.0.0 so the port mapping can reach it; the host side
# of the mapping stays on loopback. Put an HTTPS reverse proxy in front of
# 127.0.0.1:26124 for anything beyond local development (packages/cloud/README.md).

services:
  cloud:
    image: ghcr.io/conradstorz/ice-colder-cloud:latest
    build:
      context: ..
      dockerfile: packages/cloud/Dockerfile
    labels:
      - com.centurylinklabs.watchtower.enable=true
    container_name: ice-cloud
    environment:
      - ICE_CLOUD_HOST=0.0.0.0
      - ICE_CLOUD_DATA=/app/cloud_data
      - ICE_CLOUD_PUBLIC_URL=${ICE_CLOUD_PUBLIC_URL:-}
      - ICE_CLOUD_GOOGLE_CLIENT_ID=${ICE_CLOUD_GOOGLE_CLIENT_ID:-}
      - ICE_CLOUD_GOOGLE_CLIENT_SECRET=${ICE_CLOUD_GOOGLE_CLIENT_SECRET:-}
      - ICE_CLOUD_ADMINS=${ICE_CLOUD_ADMINS:-}
      - ICE_CLOUD_SESSION_KEY=${ICE_CLOUD_SESSION_KEY:?set ICE_CLOUD_SESSION_KEY in .env (at least 32 bytes)}
      - ICE_CLOUD_INSECURE_COOKIES=${ICE_CLOUD_INSECURE_COOKIES:-}
      - ICE_CLOUD_TRUSTED_UI_DIGESTS=${ICE_CLOUD_TRUSTED_UI_DIGESTS:-}
      - ICE_CLOUD_SMTP_HOST=${ICE_CLOUD_SMTP_HOST:-}
      - ICE_CLOUD_SMTP_PORT=${ICE_CLOUD_SMTP_PORT:-}
      - ICE_CLOUD_SMTP_USER=${ICE_CLOUD_SMTP_USER:-}
      - ICE_CLOUD_SMTP_PASSWORD=${ICE_CLOUD_SMTP_PASSWORD:-}
      - ICE_CLOUD_SMTP_FROM=${ICE_CLOUD_SMTP_FROM:-}
      - ICE_CLOUD_SMTP_STARTTLS=${ICE_CLOUD_SMTP_STARTTLS:-}
    ports:
      - "127.0.0.1:26124:26124"
    volumes:
      - ../cloud_data:/app/cloud_data
    restart: unless-stopped

  backup:
    # Verified archive (polled every 6 h, written at most once per 20 h) of cloud.db into cloud_data/backups (docs/backups.md).
    # Off-host copies are the operator's job.
    image: ghcr.io/conradstorz/ice-colder-cloud:latest
    build:
      context: ..
      dockerfile: packages/cloud/Dockerfile
    labels:
      - com.centurylinklabs.watchtower.enable=true
    container_name: ice-cloud-backup
    healthcheck:
      # Unhealthy when the newest archive is older than 26 hours.
      test: ["CMD-SHELL", "find /app/cloud_data/backups -name 'cloud-*.tar.gz' -mmin -1560 | grep -q ."]
      interval: 1h
      start_period: 10m
    command:
      - sh
      - -c
      - >-
        while true; do
        python scripts/backup_data.py --label cloud --dest /app/cloud_data/backups --keep 30 --min-age-hours 20
        --sqlite /app/cloud_data/cloud.db;
        sleep 21600;
        done
    volumes:
      - ../cloud_data:/app/cloud_data
    restart: unless-stopped
