name: mosquitto_broker

# Broker-only prod stack. Requires a `.env` in the repo root. From this
# directory:
#   cp ../.env.example ../.env   # then set MQTT_PASSWORD and the other values
#   docker compose --env-file ../.env -f docker-compose.prod.yml up -d

services:
  mosquitto-init:
    # One-shot: writes the broker password file from .env before mosquitto starts.
    image: eclipse-mosquitto:2
    container_name: ice-colder-mqtt-init
    # Explicit: must be able to write the bind-mounted config dir and chown.
    user: root
    environment:
      - MQTT_USERNAME=${MQTT_USERNAME:?set MQTT_USERNAME in .env}
      - MQTT_PASSWORD=${MQTT_PASSWORD:?set MQTT_PASSWORD in .env}
    volumes:
      - ./mosquitto/config:/mosquitto/config
    entrypoint: ["sh", "-c"]
    command:
      - >-
        if [ "$$MQTT_PASSWORD" = "change-me" ] || [ "$${#MQTT_PASSWORD}" -lt 12 ]; then
          echo "mosquitto-init: MQTT_PASSWORD is the .env.example placeholder or shorter than 12 characters; set a real one in .env" >&2; exit 1;
        fi &&
        mosquitto_passwd -c -b /mosquitto/config/passwd "$$MQTT_USERNAME" "$$MQTT_PASSWORD" &&
        chmod 600 /mosquitto/config/passwd &&
        chown mosquitto:mosquitto /mosquitto/config/passwd
    restart: "no"

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: ice-colder-mqtt
    ports:
      - "${MQTT_BIND_ADDR:?set MQTT_BIND_ADDR in .env to the LAN interface address}:1883:1883"
    # Mount the whole config dir (not the individual files): `passwd` is
    # gitignored and written by mosquitto-init at startup, so a single-file
    # bind mount would let Docker create it as a directory on a fresh
    # checkout. No :ro here either — the image entrypoint chowns under
    # /mosquitto/config on start.
    command: ["/usr/sbin/mosquitto", "-c", "/mosquitto/config/mosquitto-prod.conf"]
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    environment:
      - MQTT_USERNAME=${MQTT_USERNAME}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
    restart: unless-stopped
    depends_on:
      mosquitto-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -u \"$$MQTT_USERNAME\" -P \"$$MQTT_PASSWORD\" -t '$$SYS/broker/uptime' -C 1 -W 3"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s
