# Mosquitto MQTT broker configuration for ice-colder PRODUCTION
#
# Requires a password file at /mosquitto/config/passwd. The compose stacks
# generate it from .env (MQTT_USERNAME / MQTT_PASSWORD) via the one-shot
# mosquitto-init service before the broker starts. Do not hand-edit it with
# mosquitto_passwd: the VMC, the simulators and Home Assistant all use the
# .env values, and a file that drifts from them breaks every client.
#
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type warning
log_type error
log_type notice
