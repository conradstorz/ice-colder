[platformio]
default_envs = esp32-s3-devkitc-1

[env]
lib_deps = bblanchon/ArduinoJson@7.4.3
build_flags = -std=gnu++17 -Wall -Wextra -Werror -DARDUINOJSON_POOL_CAPACITY=32
lib_extra_dirs = ../common
test_framework = unity

[env:esp32-s3-devkitc-1]
platform = espressif32@^6.9
board = esp32-s3-devkitc-1
framework = espidf
board_build.partitions = partitions.csv
monitor_speed = 115200
build_flags = ${env.build_flags} -DMDBCORE_TARGET_ESP32
# Compile-time defaults for the NVS settings, as in firmware/vending (quote string values):
#   -DBOARD_DEFAULT_WIFI_SSID=\"mynet\"  -DBOARD_DEFAULT_WIFI_PASS=\"secret\"
#   -DBOARD_DEFAULT_MQTT_HOST=\"192.168.1.10\"  -DBOARD_DEFAULT_MACHINE_ID=\"vm-01\"

[env:native]
platform = native
build_flags = ${env.build_flags} -DMDBCORE_TARGET_NATIVE
test_build_src = false
