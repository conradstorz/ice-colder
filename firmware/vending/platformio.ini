[platformio]
default_envs = kc868-a8

[env]
lib_deps = bblanchon/ArduinoJson@^7.2
# ARDUINOJSON_POOL_CAPACITY=32 keeps ArduinoJson's slot pool (32 slots) inside the
# 4096-byte decode arena in lib/vendcore/command.cpp; the two numbers are coupled.
build_flags = -std=gnu++17 -Wall -Wextra -Werror -DARDUINOJSON_POOL_CAPACITY=32
test_framework = unity

[env:kc868-a8]
platform = espressif32@^6.9
board = esp32dev
framework = espidf
board_build.partitions = partitions_singleapp_large.csv
monitor_speed = 115200
build_flags = ${env.build_flags} -DVENDCORE_TARGET_ESP32
# Compile-time defaults for the NVS settings (all empty by default; quote string values):
#   -DVEND_DEFAULT_WIFI_SSID=\"mynet\"
#   -DVEND_DEFAULT_WIFI_PASS=\"secret\"
#   -DVEND_DEFAULT_MQTT_HOST=\"192.168.1.10\"
#   -DVEND_DEFAULT_MQTT_PORT=1883
#   -DVEND_DEFAULT_MQTT_USER=\"vending\"
#   -DVEND_DEFAULT_MQTT_PASS=\"secret\"
#   -DVEND_DEFAULT_MACHINE_ID=\"vm-01\"


[env:native]
platform = native
build_flags = ${env.build_flags} -DVENDCORE_TARGET_NATIVE
test_build_src = false
