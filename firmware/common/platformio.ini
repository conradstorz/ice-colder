; Host tests for the shared platform libraries (boardcore). Production builds consume these
; through each board project's `lib_extra_dirs = ../common`; this file only hosts the native tests.
[platformio]
default_envs = native

[env:native]
platform = native
test_framework = unity
; (not lib_extra_dirs = .: that would scan .pio itself)
lib_deps =
    bblanchon/ArduinoJson@7.4.3
    symlink://boardcore
build_flags = -std=gnu++17 -Wall -Wextra -Werror -DARDUINOJSON_POOL_CAPACITY=32
test_build_src = false
