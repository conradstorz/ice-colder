<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Vending Machine</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js"></script>
  
  <script src="/static/feedback.js" defer></script>
</head>
<body class="bg-slate-50 text-gray-900 font-sans text-base min-h-screen"
      hx-boost="true" hx-target="main" hx-swap="outerHTML show:top">
  

<div aria-hidden="true" class="fixed inset-0 z-0 pointer-events-none flex items-center justify-center overflow-hidden text-slate-900/10">

  <rect x="180" y="76" width="34" height="22" rx="6"/>
  <rect x="180" y="106" width="34" height="22" rx="6"/>
  <rect x="180" y="136" width="34" height="22" rx="6"/>

</div>

  

  
  <header id="bar" hx-swap-oob="true"
          class="relative h-14 bg-slate-800 text-white flex items-center gap-2 px-3 sticky top-0 z-20">
    
      
      
      
      
      

      
      <a href="/"
         class="touch-target px-3 rounded-md text-sm font-medium text-white hover:bg-slate-700 shrink-0 max-md:hidden">Home</a>
      
      
      <a href="/health"
         class="touch-target px-3 rounded-md text-sm font-medium text-white hover:bg-slate-700 shrink-0">Back</a>
      

      <nav class="flex-1 min-w-0 flex items-center gap-1 overflow-hidden" aria-label="Breadcrumb">
        
          
          <a href="/"
             class="touch-target px-2 rounded-md shrink-0 text-sm text-slate-300 hover:text-white whitespace-nowrap max-md:hidden">Home</a>
          <span class="shrink-0 text-slate-500 max-md:hidden" aria-hidden="true">/</span>
          
        
          
          <a href="/health"
             class="touch-target px-2 rounded-md shrink-0 text-sm text-slate-300 hover:text-white whitespace-nowrap">Health</a>
          <span class="shrink-0 text-slate-500" aria-hidden="true">/</span>
          
        
          
          <span class="shrink-0 text-sm font-semibold text-white truncate" aria-current="page">Faults</span>
          
        
      </nav>

      <a href="/health/faults" class="touch-target px-2 shrink-0" aria-label="System health">
        
        <span id="pill" hx-get="/pill" hx-trigger="load, every 5s" hx-swap="outerHTML" hx-target="this"
              class="inline-flex items-center rounded-full bg-slate-400 text-white text-xs font-semibold uppercase tracking-wide px-2 py-1">…</span>
      </a><span id="source-tag" title="This page is served by the machine itself" class="inline-flex items-center rounded-md bg-emerald-500 text-emerald-950 text-xs font-semibold uppercase tracking-wide px-2 py-1 shrink-0">LOCAL</span>

      <button hx-post="/logout"
              class="touch-target px-3 rounded-md text-sm font-medium text-white hover:bg-slate-700 shrink-0">Sign out</button>

      
      
    
  </header>

  <main class="relative z-10 max-w-5xl mx-auto px-4 py-4">
    
  </main>

</body>
</html>
